name: release
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      -
        name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must hold a bare X.Y.Z version, got: ${VERSION}"
            exit 1
          fi
          # Tag existence, not a diff against the parent commit, so re-runs and
          # manual dispatches after a failed release pick up where they stopped.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Create and push tag
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "release ${TAG}"
          git push origin "refs/tags/${TAG}"
        env:
          TAG: ${{ steps.version.outputs.tag }}
      -
        name: Set up Go
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          go-version: '1.24'
          cache: false
      -
        name: Import GPG key
        if: steps.version.outputs.release == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Run GoReleaser
        if: steps.version.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
